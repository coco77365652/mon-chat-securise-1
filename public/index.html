<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messagerie sécurisée</title>
<script src="/socket.io/socket.io.js"></script>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --text:#1a1c1f; --muted:#6b7280;
  --accent:#4f46e5; --accent-2:#6366f1; --bubble-me:#4f46e5; --bubble-them:#eceef1;
  --border:#e5e7eb; --danger:#dc2626; --admin:#16a34a;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111214; --panel:#1b1c1f; --text:#f2f3f5; --muted:#9aa0a6;
    --bubble-them:#2a2c30; --border:#2c2d31;
  }
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg); color:var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display:flex; align-items:center; justify-content:center; padding:16px;
}
.wrap{width:100%; max-width:440px;}

#gate{
  background:var(--panel); border:1px solid var(--border); border-radius:16px;
  padding:32px 24px; text-align:center;
}
.lock-icon{
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;margin:0 auto 16px; font-size:26px;
}
#gate h1{font-size:1.2rem;margin:0 0 4px;}
#gate p{color:var(--muted); font-size:.9rem; margin:0 0 20px;}
#codeInput{
  width:100%; padding:14px; font-size:1.3rem; text-align:center; letter-spacing:4px;
  border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); outline:none;
}
#codeInput:focus{border-color:var(--accent);}
#enterBtn{
  width:100%; margin-top:14px; padding:13px; border:none; border-radius:10px;
  background:var(--accent); color:white; font-size:1rem; font-weight:600; cursor:pointer;
}
#gateError{color:var(--danger); font-size:.85rem; min-height:18px; margin-top:10px;}

#chatApp{height:min(640px, 80vh); background:var(--panel); border:1px solid var(--border); border-radius:16px; overflow:hidden; display:none; flex-direction:column;}
#chatApp.active{display:flex;}
.chat-header{
  display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border);
  background:var(--panel); flex-shrink:0;
}
.avatar{
  width:40px;height:40px;border-radius:50%; background:linear-gradient(135deg,#64748b,#334155);
  display:flex;align-items:center;justify-content:center;color:white;font-weight:700;flex-shrink:0;
}
.avatar.admin-glow{background:linear-gradient(135deg,var(--admin),#22c55e);}
.chat-header .info{flex:1; min-width:0;}
.chat-header .name{font-weight:600; display:flex; align-items:center; gap:6px;}
.chat-header .status{font-size:.78rem; color:var(--muted);}
.badge{
  font-size:.65rem; font-weight:700; padding:2px 7px; border-radius:999px;
  background:var(--admin); color:white; text-transform:uppercase;
}
.header-btn{
  border:none; background:transparent; font-size:1.2rem; cursor:pointer; padding:6px; flex-shrink:0;
}
#messages{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px;}
.msg{max-width:78%; padding:10px 13px; border-radius:16px; font-size:.92rem; line-height:1.35; word-wrap:break-word;}
.msg.them{background:var(--bubble-them); color:var(--text); align-self:flex-start; border-bottom-left-radius:4px;}
.msg.me{background:var(--bubble-me); color:white; align-self:flex-end; border-bottom-right-radius:4px;}
.empty-state{margin:auto; color:var(--muted); font-size:.88rem; text-align:center;}

#composer{display:flex; gap:8px; padding:12px; border-top:1px solid var(--border); flex-shrink:0;}
#msgInput{
  flex:1; padding:11px 14px; border-radius:20px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); outline:none; font-size:.92rem;
}
#msgInput:focus{border-color:var(--accent);}
#sendBtn{
  width:42px;height:42px;border-radius:50%; border:none; background:var(--accent); color:white;
  font-size:1.1rem; cursor:pointer; flex-shrink:0;
}

#adminPanel{display:none; border-top:1px solid var(--border); background:var(--bg); max-height:260px; overflow-y:auto;}
#adminPanel.active{display:block;}
.tabs{display:flex; border-bottom:1px solid var(--border);}
.tab-btn{
  flex:1; padding:10px; border:none; background:transparent; color:var(--muted);
  font-size:.83rem; font-weight:600; cursor:pointer; border-bottom:2px solid transparent;
}
.tab-btn.active{color:var(--admin); border-bottom-color:var(--admin);}
.tab-content{display:none; padding:14px 16px;}
.tab-content.active{display:block;}
.code-item, .conv-item{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:9px 12px; border-radius:8px; background:var(--panel); border:1px solid var(--border);
  margin-bottom:6px; font-size:.9rem;
}
.conv-item{cursor:pointer;}
.conv-item.selected{border-color:var(--admin);}
.del-btn{border:none; background:transparent; color:var(--danger); cursor:pointer; font-weight:600;}
</style>
</head>
<body>
<div class="wrap">

  <div id="gate">
    <div class="lock-icon">🔒</div>
    <h1>Accès requis</h1>
    <p>Entrez le code d'accès pour ouvrir la messagerie</p>
    <input id="codeInput" type="text" maxlength="12" placeholder="Code">
    <button id="enterBtn">Entrer</button>
    <div id="gateError"></div>
  </div>

  <div id="chatApp">
    <div class="chat-header">
      <div class="avatar" id="avatar">A</div>
      <div class="info">
        <div class="name"><span id="headerNameText">admin</span> <span class="badge" id="adminBadge" style="display:none;">Admin</span></div>
        <div class="status" id="statusLine">en ligne</div>
      </div>
      <button class="header-btn" id="adminPanelToggle" style="display:none;">⚙️</button>
      <button class="header-btn" id="logoutBtn" style="color:var(--danger);">⏻</button>
    </div>

    <div id="adminPanel">
      <div class="tabs">
        <button class="tab-btn active" id="tabConvBtn">Discussions</button>
        <button class="tab-btn" id="tabCodesBtn">Codes</button>
      </div>
      <div class="tab-content active" id="tabConv"><div id="convList"></div></div>
      <div class="tab-content" id="tabCodes">
        <div style="display:flex; gap:8px; margin-bottom:12px;">
          <input id="customPseudoInput" type="text" placeholder="Nom/Pseudo (ex: test)" style="flex:1; padding:9px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); outline:none; font-size:.88rem;">
          <button id="genCodeBtn" style="padding:9px 12px; border:none; border-radius:8px; background:var(--admin); color:white; font-weight:600; font-size:.88rem; cursor:pointer; white-space:nowrap;">Générer</button>
        </div>
        <div id="codeList"></div>
      </div>
    </div>

    <div id="messages"></div>

    <div id="composer">
      <input id="msgInput" type="text" maxlength="500" placeholder="Écrire un message...">
      <button id="sendBtn">➤</button>
    </div>
  </div>

</div>

<script>
const socket = io();

let isAdmin = false;
let activeConvKey = null;
let conversationsMap = new Map();
let codesArray = [];

const gate = document.getElementById('gate');
const chatApp = document.getElementById('chatApp');
const codeInput = document.getElementById('codeInput');
const enterBtn = document.getElementById('enterBtn');
const gateError = document.getElementById('gateError');
const messagesEl = document.getElementById('messages');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const avatar = document.getElementById('avatar');
const headerNameText = document.getElementById('headerNameText');
const adminBadge = document.getElementById('adminBadge');
const statusLine = document.getElementById('statusLine');
const adminPanelToggle = document.getElementById('adminPanelToggle');
const logoutBtn = document.getElementById('logoutBtn');
const adminPanel = document.getElementById('adminPanel');
const genCodeBtn = document.getElementById('genCodeBtn');
const customPseudoInput = document.getElementById('customPseudoInput');
const codeList = document.getElementById('codeList');
const convList = document.getElementById('convList');
const tabConvBtn = document.getElementById('tabConvBtn');
const tabCodesBtn = document.getElementById('tabCodesBtn');
const tabConv = document.getElementById('tabConv');
const tabCodes = document.getElementById('tabCodes');

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML;
}

enterBtn.addEventListener('click', () => {
  const val = codeInput.value.trim();
  if(!val) return;
  socket.emit('authenticate', val);
});
codeInput.addEventListener('keydown', e => { if(e.key === 'Enter') enterBtn.click(); });

socket.on('auth_error', (msg) => {
  gateError.textContent = msg;
});

socket.on('auth_success', (data) => {
  gate.style.display = 'none';
  chatApp.classList.add('active');
  gateError.textContent = '';

  if (data.role === 'admin') {
    isAdmin = true;
    adminBadge.style.display = 'inline-block';
    adminPanelToggle.style.display = 'inline-block';
    headerNameText.textContent = 'Sélectionnez une discussion';
    avatar.classList.add('admin-glow');
    msgInput.disabled = true;
    sendBtn.disabled = true;

    codesArray = data.codes || [];
    data.conversations.forEach(c => conversationsMap.set(c.code, c));
    
    renderConvList();
    renderCodeList();
    adminPanel.classList.add('active');
  } else {
    isAdmin = false;
    activeConvKey = data.code;
    headerNameText.textContent = 'admin';
    renderMessages(data.messages);
  }
});

socket.on('new_message', ({ targetCode, message }) => {
  if (conversationsMap.has(targetCode)) {
    conversationsMap.get(targetCode).messages.push(message);
  }

  if (isAdmin) {
    renderConvList();
    if (activeConvKey === targetCode) {
      appendSingleMessage(message, message.from === 'admin' ? 'me' : 'them');
    }
  } else {
    appendSingleMessage(message, message.from === 'user' ? 'me' : 'them');
  }
});

socket.on('message_deleted', ({ targetCode, ts }) => {
  if (conversationsMap.has(targetCode)) {
    const conv = conversationsMap.get(targetCode);
    conv.messages = conv.messages.filter(m => m.ts !== ts);
  }
  if (!isAdmin || activeConvKey === targetCode) {
    const el = document.querySelector(`[data-ts="${ts}"]`);
    if (el) el.remove();
  }
});

function sendMessage(){
  const val = msgInput.value.trim();
  if(!val) return;
  socket.emit('send_message', { text: val, targetCode: activeConvKey });
  msgInput.value = '';
}
sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keydown', e => { if(e.key === 'Enter') sendMessage(); });

function renderMessages(msgArray){
  messagesEl.innerHTML = '';
  if(!msgArray || msgArray.length === 0){
    messagesEl.innerHTML = '<div class="empty-state">Aucun message pour l\'instant.</div>';
    return;
  }
  msgArray.forEach(m => {
    const cls = isAdmin ? (m.from === 'admin' ? 'me' : 'them') : (m.from === 'user' ? 'me' : 'them');
    appendSingleMessage(m, cls);
  });
}

function appendSingleMessage(m, cls){
  const empty = messagesEl.querySelector('.empty-state');
  if(empty) empty.remove();

  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.dataset.ts = m.ts;
  div.textContent = m.text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// CORRECTION ICI : Envoi explicite du texte du pseudo au serveur
genCodeBtn.addEventListener('click', () => {
  const customPseudo = customPseudoInput.value;
  socket.emit('admin_generate_code', customPseudo);
  customPseudoInput.value = '';
});

socket.on('code_generated', (entry) => {
  codesArray.push(entry);
  conversationsMap.set(entry.code, { label: entry.pseudo, messages: [] });
  renderCodeList();
  renderConvList();
});

function renderCodeList(){
  codeList.innerHTML = '';
  if(codesArray.length === 0){
    codeList.innerHTML = '<div style="color:var(--muted); font-size:.85rem; text-align:center; padding:8px 0;">Aucun code généré pour l\'instant.</div>';
    return;
  }
  codesArray.forEach(entry => {
    const row = document.createElement('div');
    row.className = 'code-item';
    
    const infoSpan = document.createElement('span');
    infoSpan.innerHTML = `<b>${escapeHtml(entry.pseudo)}</b><br><small style="color:var(--muted); font-family:monospace;">${escapeHtml(entry.code)}</small>`;
    
    const delBtn = document.createElement('button');
    delBtn.className = 'del-btn';
    delBtn.textContent = 'Supprimer';
    delBtn.addEventListener('click', () => {
      socket.emit('admin_delete_code', entry.code);
    });

    row.appendChild(infoSpan);
    row.appendChild(delBtn);
    codeList.appendChild(row);
  });
}

socket.on('code_deleted', (code) => {
  codesArray = codesArray.filter(c => c.code !== code);
  conversationsMap.delete(code);
  renderCodeList();
  renderConvList();
});

function renderConvList(){
  convList.innerHTML = '';
  if(conversationsMap.size === 0){
    convList.innerHTML = '<div style="color:var(--muted); font-size:.85rem; text-align:center; padding:8px 0;">Aucune discussion pour l\'instant.</div>';
    return;
  }
  conversationsMap.forEach((conv, key) => {
    const last = conv.messages.length ? conv.messages[conv.messages.length - 1].text : 'Aucun message';
    const item = document.createElement('div');
    item.className = 'conv-item' + (key === activeConvKey ? ' selected' : '');
    item.innerHTML = `<div><b>${escapeHtml(conv.label)}</b><br><small style="color:var(--muted);">${escapeHtml(last)}</small></div>`;
    item.addEventListener('click', () => {
      activeConvKey = key;
      headerNameText.textContent = conv.label;
      msgInput.disabled = false;
      sendBtn.disabled = false;
      renderMessages(conv.messages);
      renderConvList();
    });
    convList.appendChild(item);
  });
}

adminPanelToggle.addEventListener('click', () => adminPanel.classList.toggle('active'));

tabConvBtn.addEventListener('click', () => {
  tabConvBtn.classList.add('active'); 
  tabCodesBtn.classList.remove('active');
  tabConv.classList.add('active'); 
  tabCodes.classList.remove('active');
});

tabCodesBtn.addEventListener('click', () => {
  tabCodesBtn.classList.add('active'); 
  tabConvBtn.classList.remove('active');
  tabCodes.classList.add('active'); 
  tabConv.classList.remove('active');
});

logoutBtn.addEventListener('click', () => location.reload());
</script>
</body>
</html>
