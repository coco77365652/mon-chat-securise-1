<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Chat Sécurisé</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; color: #007bff; }
        input, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 5px; border: none; font-size: 16px; }
        input { background: #2d2d2d; color: #fff; }
        button { background: #007bff; color: #fff; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        #chat-screen { display: none; flex-direction: column; height: 80vh; max-width: 600px; width: 100%; }
        #messages { flex: 1; overflow-y: auto; background: #1e1e1e; padding: 15px; border-radius: 10px 10px 0 0; margin-bottom: 10px; }
        .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 5px; background: #2d2d2d; word-wrap: break-word; }
        .msg .author { font-weight: bold; color: #007bff; margin-right: 8px; }
        .msg .time { font-size: 0.8em; color: #888; margin-left: 8px; }
        .system-msg { text-align: center; color: #888; font-style: italic; margin-bottom: 10px; }
        .input-box { display: flex; gap: 10px; }
        .input-box input { margin-bottom: 0; }
        .input-box button { width: auto; padding: 0 20px; }
    </style>
</head>
<body>

    <div id="login-screen" class="card">
        <h2>Rejoindre un Chat</h2>
        <input type="text" id="pseudo-input" placeholder="Votre pseudonyme..." />
        <input type="text" id="code-input" placeholder="Code du salon..." />
        <button onclick="joinRoom()">Entrer</button>
    </div>

    <div id="chat-screen">
        <div id="messages"></div>
        <div class="input-box">
            <input type="text" id="msg-input" placeholder="Écrivez un message..." onkeypress="handleKeyPress(event)" />
            <button onclick="sendMessage()">Envoyer</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRoom = '';

        function joinRoom() {
            const pseudo = document.getElementById('pseudo-input').value.trim() || 'Anonyme';
            const roomCode = document.getElementById('code-input').value.trim();

            if (!roomCode) {
                alert('Veuillez entrer un code de salon.');
                return;
            }

            currentRoom = roomCode;
            socket.emit('join_room', { roomCode, pseudo });

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (text) {
                socket.emit('send_message', { text });
                input.value = '';
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        socket.on('user_joined', (data) => {
            addSystemMessage(data.message);
        });

        socket.on('user_left', (data) => {
            addSystemMessage(data.message);
        });

        socket.on('new_message', (data) => {
            const box = document.getElementById('messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg';
            msgDiv.id = 'msg-' + data.id;
            msgDiv.innerHTML = `<span class="author">${data.pseudo} :</span>${data.text}<span class="time">${data.timestamp}</span>`;
            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;

            // Auto-destruction au bout de 60 secondes
            setTimeout(() => {
                const el = document.getElementById('msg-' + data.id);
                if (el) el.remove();
            }, 60000);
        });

        function addSystemMessage(text) {
            const box = document.getElementById('messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'system-msg';
            msgDiv.innerText = text;
            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
